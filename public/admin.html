<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Chef on Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
:root{--navy:#013E7F;--deep:#012a57;--abyss:#011a36;--gold:#4fa8dc;--sand:#f6f1e7;--cream:#fbf9f4;--line:#dfe4ec;--text:#1d2a3a;--muted:#5b6878;--red:#b4492f;--green:#2f7d4f;
  --serif:Poppins,system-ui,sans-serif;--logo:"Playfair Display",Georgia,"Times New Roman",serif;--sans:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--text);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;color:#0b1b2e}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:.92rem;text-decoration:none}
.btn-gold{background:var(--navy);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-red{background:#fff;border:1px solid #e6c2b8;color:var(--red)}
.btn:disabled{opacity:.6;cursor:default}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#010f22 0%,#012a57 55%,#0b3d70 56%,#031a35 100%);padding:20px}
.lcard{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:380px;box-shadow:0 30px 60px rgba(0,0,0,.35);text-align:center}
.lcard .mono{font-family:var(--logo);font-size:2.6rem;color:var(--navy);line-height:1}
.lcard h1{font-size:1.4rem;margin:8px 0 4px}
.lcard p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.lcard input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:1.05rem;text-align:center;letter-spacing:.2em}
.lcard .btn{width:100%;justify-content:center;margin-top:14px;padding:13px}
.lerr{color:var(--red);font-size:.88rem;margin-top:12px;min-height:1.2em}

/* App */
#app{display:none}
header{background:var(--abyss);color:#fff}
header .in{max-width:1200px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header .t{display:flex;align-items:center;gap:12px}
header .t b{font-family:var(--logo);font-size:1.7rem;font-weight:500;color:var(--gold)}
header .t span{font-size:1rem;opacity:.9}
.tabs{display:flex;gap:6px}
.tabs button{background:transparent;color:rgba(255,255,255,.75);border:0;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500}
.tabs button.on{background:rgba(255,255,255,.12);color:#fff}
.tabs .count{background:var(--gold);color:#fff;border-radius:999px;padding:1px 7px;font-size:.75rem;margin-left:6px}
main{max-width:1200px;margin:0 auto;padding:28px 22px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.bar h2{font-size:1.7rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.course{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.course h3{font-size:1.15rem}
.meta{color:var(--muted);font-size:.9rem;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--sand);color:var(--navy);border-radius:999px;padding:3px 10px;font-size:.8rem}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;margin-left:8px;vertical-align:middle}
.tag.pub{background:#e3f1e8;color:var(--green)}
.tag.draft{background:#eef0f3;color:var(--muted)}
.tag.past{background:#f6e8e4;color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.seatctl{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}
.seatctl button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.1rem}
.empty{text-align:center;color:var(--muted);padding:40px;border:1px dashed var(--line);border-radius:16px;background:#fff}

/* Editor */
.modal{position:fixed;inset:0;background:rgba(1,15,34,.6);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:720px}
.sheet h2{margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px;color:#0b1b2e}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfd}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--navy);border-color:transparent}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.sheet .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.ferr{color:var(--red);font-size:.88rem;margin-top:10px}

/* Richieste */
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{background:var(--sand);font-weight:600;color:#0b1b2e;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
td a{color:var(--navy)}
td select{padding:6px 8px;font-size:.85rem}
.note{color:var(--muted);font-size:.85rem;margin-top:4px;white-space:pre-wrap}
.tablewrap{overflow-x:auto;border-radius:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b1b2e;color:#fff;padding:12px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
@media(max-width:640px){.grid{grid-template-columns:1fr}.course{grid-template-columns:1fr}header .t span{display:none}}
</style>
</head>
<body>

<section id="login">
  <form class="lcard" id="lform">
    <div class="mono">AS</div>
    <h1>Area riservata</h1>
    <p>Chef on Board — gestione corsi</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn btn-navy" type="submit" id="lbtn">Entra</button>
    <div class="lerr" id="lerr"></div>
    <a href="/" style="display:inline-block;margin-top:8px;color:var(--muted);font-size:.85rem">← Torna al sito</a>
  </form>
</section>

<div id="app">
  <header><div class="in">
    <div class="t"><b>AS</b><span>Chef on Board · Admin</span></div>
    <div class="tabs">
      <button id="tCorsi" class="on">Corsi</button>
      <button id="tRich">Richieste<span class="count" id="nNew" style="display:none"></span></button>
    </div>
    <div style="display:flex;gap:8px"><a class="btn btn-line" href="/" target="_blank">Vedi sito</a><button class="btn btn-line" id="logout">Esci</button></div>
  </div></header>

  <main>
    <div id="vCorsi">
      <div class="bar"><h2>I tuoi corsi</h2><button class="btn btn-gold" id="addBtn">+ Nuovo corso</button></div>
      <div id="corsiList"></div>
    </div>
    <div id="vRich" style="display:none">
      <div class="bar"><h2>Richieste di informazioni</h2><button class="btn btn-line" id="csvBtn">Scarica CSV</button></div>
      <div id="richList"></div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <form class="sheet" id="cform">
    <h2 id="mTitle">Nuovo corso</h2>
    <p style="color:var(--muted);margin-bottom:18px;font-size:.9rem">Le informazioni compaiono nella sezione "Prossimi corsi" del sito.</p>
    <div class="grid">
      <div class="full"><label for="fTitolo">Titolo del corso</label><input type="text" id="fTitolo" placeholder="Chef on Board — Edizione Sardegna" required></div>
      <div><label for="fInizio">Data inizio</label><input type="date" id="fInizio" required></div>
      <div><label for="fFine">Data fine <small>(facoltativa)</small></label><input type="date" id="fFine"></div>
      <div class="full"><label for="fSede">Luogo / sede</label><input type="text" id="fSede" placeholder="Es. Olbia (SS) — Hotel …"></div>
      <div><label for="fOrario">Orari <small>(facoltativo)</small></label><input type="text" id="fOrario" placeholder="Es. 9:30 – 17:30"></div>
      <div><label for="fPrezzo">Prezzo <small>(facoltativo)</small></label><input type="text" id="fPrezzo" placeholder="Es. € 690 IVA inclusa"></div>
      <div><label for="fTot">Numero massimo partecipanti</label><input type="number" id="fTot" min="0" value="12"></div>
      <div><label for="fOcc">Partecipanti già iscritti</label><input type="number" id="fOcc" min="0" value="0"></div>
      <div class="full"><label for="fArg">Argomenti <small>(uno per riga)</small></label><textarea id="fArg" rows="5" placeholder="Preference list&#10;Gestione della galley&#10;Vita a bordo e contratti&#10;STCW ed ENG1"></textarea></div>
      <div class="full"><label for="fProg">Programma <small>(dettaglio giornate e orari)</small></label><textarea id="fProg" rows="7" placeholder="Giorno 1&#10;9:30 – Accoglienza e presentazione&#10;10:00 – Il mondo del private chef&#10;…"></textarea></div>
      <div class="full"><label class="check"><input type="checkbox" id="fPub" checked> Pubblicato sul sito</label></div>
    </div>
    <div class="ferr" id="ferr"></div>
    <div class="foot">
      <button type="button" class="btn btn-line" id="cancel">Annulla</button>
      <button type="submit" class="btn btn-navy" id="saveBtn">Salva corso</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var token=null; try{token=sessionStorage.getItem('cob_t')}catch(e){}
  var corsi=[], rich=[], editId=null;
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(function(){el.classList.remove('on')},2200)}
  function fmt(d){if(!d)return'—';var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}
  function api(method,url,body){
    return fetch(url,{method:method,headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(r.status===401&&url!=='/api/login'){logout();throw new Error('Sessione scaduta')}if(!r.ok)throw new Error(j.error||'Errore');return j})});
  }

  /* Login */
  $('lform').addEventListener('submit',function(e){
    e.preventDefault();$('lerr').textContent='';$('lbtn').disabled=true;
    api('POST','/api/login',{password:$('pw').value}).then(function(j){
      token=j.token;try{sessionStorage.setItem('cob_t',token)}catch(e){} show();
    }).catch(function(err){$('lerr').textContent=err.message}).finally(function(){$('lbtn').disabled=false});
  });
  function logout(){ if(token) fetch('/api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(function(){});
    token=null;try{sessionStorage.removeItem('cob_t')}catch(e){} $('app').style.display='none';$('login').style.display='grid';$('pw').value=''; }
  $('logout').onclick=logout;
  function show(){$('login').style.display='none';$('app').style.display='block';loadCorsi();loadRich()}

  /* Tabs */
  $('tCorsi').onclick=function(){$('tCorsi').classList.add('on');$('tRich').classList.remove('on');$('vCorsi').style.display='';$('vRich').style.display='none'};
  $('tRich').onclick=function(){$('tRich').classList.add('on');$('tCorsi').classList.remove('on');$('vRich').style.display='';$('vCorsi').style.display='none';loadRich()};

  /* Corsi */
  function loadCorsi(){api('GET','/api/admin/corsi').then(function(c){corsi=c;renderCorsi()}).catch(function(e){toast(e.message)})}
  function renderCorsi(){
    var today=new Date().toISOString().slice(0,10);
    if(!corsi.length){$('corsiList').innerHTML='<div class="empty"><h3 style="margin-bottom:6px">Nessun corso inserito</h3>Clicca "+ Nuovo corso" per pubblicare la prima data.</div>';return}
    $('corsiList').innerHTML=corsi.map(function(c){
      var past=(c.dataFine||c.dataInizio)&&(c.dataFine||c.dataInizio)<today;
      var tag=past?'<span class="tag past">Concluso</span>':c.pubblicato?'<span class="tag pub">Pubblicato</span>':'<span class="tag draft">Bozza</span>';
      return '<div class="card course"><div><h3>'+esc(c.titolo)+tag+'</h3>'+
        '<div class="meta"><span>📅 '+fmt(c.dataInizio)+(c.dataFine&&c.dataFine!==c.dataInizio?' → '+fmt(c.dataFine):'')+'</span>'+(c.sede?'<span>📍 '+esc(c.sede)+'</span>':'')+(c.prezzo?'<span>💶 '+esc(c.prezzo)+'</span>':'')+'</div>'+
        (c.argomenti&&c.argomenti.length?'<div class="chips">'+c.argomenti.map(function(a){return '<span class="chip">'+esc(a)+'</span>'}).join('')+'</div>':'')+
        '<div class="seatctl">Partecipanti: <button data-seat="-1" data-id="'+c.id+'" aria-label="Togli un partecipante">−</button><b>'+(c.postiOccupati||0)+' / '+(c.postiTotali||0)+'</b><button data-seat="1" data-id="'+c.id+'" aria-label="Aggiungi un partecipante">+</button></div></div>'+
        '<div class="acts"><button class="btn btn-line" data-edit="'+c.id+'">Modifica</button><button class="btn btn-red" data-del="'+c.id+'">Elimina</button></div></div>';
    }).join('');
  }
  $('corsiList').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.edit) openEditor(corsi.find(function(c){return c.id===b.dataset.edit}));
    if(b.dataset.del){var c=corsi.find(function(x){return x.id===b.dataset.del});
      if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Conferma eliminazione';setTimeout(function(){if(b.isConnected){b.dataset.confirm='';b.textContent='Elimina'}},3500);return}
      api('DELETE','/api/admin/corsi/'+c.id).then(function(){toast('Corso eliminato');loadCorsi()}).catch(function(e){toast(e.message)})}
    if(b.dataset.seat){var c2=corsi.find(function(x){return x.id===b.dataset.id});var n=Math.max(0,(c2.postiOccupati||0)+(+b.dataset.seat));
      if(c2.postiTotali&&n>c2.postiTotali)return toast('Corso al completo');
      api('PUT','/api/admin/corsi/'+c2.id,Object.assign({},c2,{postiOccupati:n})).then(function(){c2.postiOccupati=n;renderCorsi()}).catch(function(e){toast(e.message)})}
  });

  function openEditor(c){
    editId=c?c.id:null; $('mTitle').textContent=c?'Modifica corso':'Nuovo corso'; $('ferr').textContent='';
    $('fTitolo').value=c?c.titolo:'Chef on Board'; $('fInizio').value=c?c.dataInizio:''; $('fFine').value=c?c.dataFine:'';
    $('fSede').value=c?c.sede:''; $('fOrario').value=c?c.orario:''; $('fPrezzo').value=c?c.prezzo:'';
    $('fTot').value=c?c.postiTotali:12; $('fOcc').value=c?c.postiOccupati:0;
    $('fArg').value=c&&c.argomenti?c.argomenti.join('\n'):''; $('fProg').value=c?c.programma:''; $('fPub').checked=c?c.pubblicato:true;
    $('modal').classList.add('open'); $('fTitolo').focus();
  }
  $('addBtn').onclick=function(){openEditor(null)};
  $('cancel').onclick=function(){$('modal').classList.remove('open')};
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))$('modal').classList.remove('open')});
  $('cform').addEventListener('submit',function(e){
    e.preventDefault();
    var d={titolo:$('fTitolo').value,dataInizio:$('fInizio').value,dataFine:$('fFine').value,sede:$('fSede').value,orario:$('fOrario').value,prezzo:$('fPrezzo').value,
      postiTotali:$('fTot').value,postiOccupati:$('fOcc').value,argomenti:$('fArg').value,programma:$('fProg').value,pubblicato:$('fPub').checked};
    if(!d.dataInizio){$('ferr').textContent='Inserisci la data di inizio.';return}
    if(d.dataFine&&d.dataFine<d.dataInizio){$('ferr').textContent='La data di fine è precedente all\'inizio.';return}
    $('saveBtn').disabled=true;
    (editId?api('PUT','/api/admin/corsi/'+editId,d):api('POST','/api/admin/corsi',d))
      .then(function(){$('modal').classList.remove('open');toast('Corso salvato');loadCorsi()})
      .catch(function(err){$('ferr').textContent=err.message}).finally(function(){$('saveBtn').disabled=false});
  });

  /* Richieste */
  var STATI=['nuova','contattato','colloquio','iscritto','perso'];
  function loadRich(){api('GET','/api/admin/richieste').then(function(r){rich=r;renderRich()}).catch(function(e){toast(e.message)})}
  function renderRich(){
    var n=rich.filter(function(r){return r.stato==='nuova'}).length;
    $('nNew').style.display=n?'':'none';$('nNew').textContent=n;
    if(!rich.length){$('richList').innerHTML='<div class="empty">Ancora nessuna richiesta. Arriveranno qui dal modulo del sito.</div>';return}
    $('richList').innerHTML='<div class="tablewrap"><table><thead><tr><th>Data</th><th>Contatto</th><th>Profilo</th><th>Corso</th><th>Stato</th><th></th></tr></thead><tbody>'+
      rich.map(function(r){
        var wa=r.tel.replace(/[^\d+]/g,'').replace(/^00/,'+'); if(wa&&wa[0]!=='+')wa='39'+wa; wa=wa.replace('+','');
        return '<tr><td>'+new Date(r.data).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td>'+
        '<td><b>'+esc(r.nome)+'</b><br><a href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener">'+esc(r.tel)+'</a><br><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></td>'+
        '<td>'+esc(r.ruolo)+'<br><span style="color:var(--muted)">'+esc(r.anni)+' anni'+(r.citta?' · '+esc(r.citta):'')+'</span>'+(r.note?'<div class="note">'+esc(r.note)+'</div>':'')+'</td>'+
        '<td>'+(esc(r.corso)||'<span style="color:var(--muted)">Prossima disponibile</span>')+'</td>'+
        '<td><select data-st="'+r.id+'">'+STATI.map(function(s){return '<option'+(s===r.stato?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td>'+
        '<td><button class="btn btn-red" style="padding:6px 12px" data-rdel="'+r.id+'">Elimina</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  $('richList').addEventListener('change',function(e){var s=e.target.closest('select[data-st]');if(!s)return;
    api('PUT','/api/admin/richieste/'+s.dataset.st,{stato:s.value}).then(function(){rich.find(function(r){return r.id===s.dataset.st}).stato=s.value;renderRich();toast('Stato aggiornato')}).catch(function(e){toast(e.message)})});
  $('richList').addEventListener('click',function(e){var b=e.target.closest('button[data-rdel]');if(!b)return;
    if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Conferma';setTimeout(function(){if(b.isConnected){b.dataset.confirm='';b.textContent='Elimina'}},3500);return}
    api('DELETE','/api/admin/richieste/'+b.dataset.rdel).then(function(){toast('Richiesta eliminata');loadRich()}).catch(function(e){toast(e.message)})});
  $('csvBtn').onclick=function(){
    var cols=['data','nome','tel','email','ruolo','anni','citta','corso','note','stato'];
    var csv=[cols.join(';')].concat(rich.map(function(r){return cols.map(function(k){return '"'+String(r[k]||'').replace(/"/g,'""')+'"'}).join(';')})).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='richieste-chef-on-board.csv';a.click();
  };

  if(token) api('GET','/api/admin/corsi').then(function(){show()}).catch(function(){});
})();
</script>
</body>
</html>
